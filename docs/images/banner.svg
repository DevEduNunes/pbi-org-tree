<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Org Tree</title>
  <desc id="d">Illustration of a vertical organization chart with connectors and cards</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3D6B"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>

  <!-- connectors -->
  <g fill="none" stroke="#9CC9F0" stroke-width="2.5" stroke-linecap="round">
    <path d="M820 92 V112 Q820 124 808 124 H716 Q704 124 704 136 V150"/>
    <path d="M820 92 V112 Q820 124 832 124 H924 Q936 124 936 136 V150"/>
    <path d="M704 202 V220 Q704 232 692 232 H644 Q632 232 632 244 V252"/>
    <path d="M704 202 V220 Q704 232 716 232 H764 Q776 232 776 244 V252"/>
  </g>

  <!-- cards -->
  <g>
    <rect x="740" y="34" width="160" height="58" rx="10" fill="#FFFFFF"/>
    <circle cx="768" cy="63" r="16" fill="#D0E6F8"/>
    <text x="768" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B3D6B">AP</text>
    <rect x="792" y="52" width="86" height="8" rx="4" fill="#1F2933"/>
    <rect x="792" y="68" width="60" height="6" rx="3" fill="#9AA5B1"/>

    <rect x="624" y="150" width="160" height="52" rx="10" fill="#FFFFFF"/>
    <circle cx="650" cy="176" r="14" fill="#D0E6F8"/>
    <rect x="674" y="164" width="86" height="8" rx="4" fill="#1F2933"/>
    <rect x="674" y="180" width="56" height="6" rx="3" fill="#9AA5B1"/>

    <rect x="856" y="150" width="160" height="52" rx="10" fill="#64C8C8"/>
    <circle cx="882" cy="176" r="14" fill="#E6F7F7"/>
    <rect x="906" y="164" width="86" height="8" rx="4" fill="#08234C"/>
    <rect x="906" y="180" width="56" height="6" rx="3" fill="#08234C" fill-opacity="0.6"/>

    <rect x="567" y="252" width="130" height="40" rx="10" fill="#FFFFFF"/>
    <rect x="583" y="266" width="86" height="8" rx="4" fill="#1F2933"/>
    <rect x="711" y="252" width="130" height="40" rx="10" fill="#FDE2E2"/>
    <rect x="727" y="266" width="86" height="8" rx="4" fill="#1F2933"/>
  </g>

  <!-- toggle pill -->
  <g>
    <rect x="686" y="193" width="36" height="18" rx="9" fill="#FFFFFF" stroke="#9CC9F0"/>
    <text x="704" y="206" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1F2933">−</text>
  </g>

  <!-- title -->
  <text x="64" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF">Org Tree</text>
  <text x="66" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#D0E6F8">Free, open-source org chart for Power BI</text>
  <text x="66" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#9CC9F0">Expand/collapse · search the reporting line · zoom · cross-filter</text>
</svg>
